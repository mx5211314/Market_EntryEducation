spring:
  datasource:
    url: jdbc:mysql://localhost:3305/invest_edu?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never   # 手动建表，不用自动执行
mybatis-plus:
  type-aliases-package: com.investedu.smartassistant.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
#mybatis:
#  mapper-locations: classpath:mapper/*.xml
#  type-aliases-package: com.investedu.smartassistant.entity
#  configuration:
#    map-underscore-to-camel-case: true   # 下划线转驼峰，重要
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发时打印SQL
jwt:
  secret: invest-edu-secret-key-please-change-in-production
  expiration: 86400000  # 1天
server:
  port: 8080
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-plus
      timeout: 120s
      max-tokens: 2048
      temperature: 0.1
      stream-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  dashscope:
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: text-embedding-v1
milvus:
  host: localhost
  port: 19530
  collection-name: investment_edu_v3  # 全新集合
elasticsearch:
  host: localhost
  port: 9200
  index-name: investment_edu_v3   # 全新索引

logging:
  level:
    dev.langchain4j: DEBUG
